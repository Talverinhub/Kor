name: Bug report / Hata bildir
description: Something doesn't work / Çalışmayan bir şeyi bildir
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Kor version / Kor sürümü
      description: Shown in Settings / Ayarlar'da yazar
      placeholder: "1.0.4.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / Ne oldu?
      description: What did you do and what did you expect? / Ne yaptın, ne bekliyordun?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Tekrar etme adımları
      placeholder: "1. Open the mini timer\n2. Press pause"
  - type: dropdown
    id: source
    attributes:
      label: Music source / Müzik kaynağı
      options:
        - None / Yok
        - Spotify
        - YouTube Music
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot / Ekran görüntüsü
      description: Hide personal information / Kişisel bilgilerini gizle
